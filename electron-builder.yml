appId: com.arif.officefocustimer
productName: Office Focus Timer
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}-${target}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Office Focus Timer
  artifactName: Office-Focus-Timer-Setup-${version}.${ext}
portable:
  artifactName: Office-Focus-Timer-Portable-${version}.${ext}
